[package]
name = "museflow-pc"
version = "0.7.1"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false
description = "MuseFlow native desktop music player"

[dependencies]
serde_json = "=1.0.154"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "=1.54.1", features = ["rt", "time", "net", "macros"] }
libloading = "=0.8.9"
lofty = "=0.25.5"
rfd = { version = "=0.18.0", default-features = false, features = ["common-controls-v6"] }
rusqlite = { version = "=0.42.0", features = ["bundled"] }
png = "=0.18.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "raw-window-handle-06"] }

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
souvlaki = { version = "=0.9.3", default-features = false }
raw-window-handle = "=0.6.2"
windows = { version = "=0.62.2", features = ["Foundation", "Media_Control", "Win32_System_WinRT"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
